name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake (runner already has the Android SDK)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MusicSpot-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MusicSpot-${{ github.run_number }}.apk

      - name: Publish APK as a GitHub release (direct download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MusicSpot #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Közvetlenül telepíthető APK. Verzió: MusicSpot #${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: MusicSpot-${{ github.run_number }}.apk
